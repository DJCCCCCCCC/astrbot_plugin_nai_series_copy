<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 32px; background: #e9eeec; color: #182824; font-family: "Microsoft YaHei", sans-serif; }
main { width: 660px; padding: 36px; background: #fff; border-top: 8px solid #2f806b; }
.eyebrow { color: #537970; font-size: 14px; font-weight: bold; }
h1 { margin: 12px 0 24px; font-size: 28px; }
.text { padding-top: 20px; border-top: 1px solid #e8edeb; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 17px; line-height: 1.8; }
</style>
</head>
<body><main>
<div class="eyebrow">NAI PROMPT</div>
<h1>翻译结果</h1>
<div class="text">{{ translation | e }}</div>
</main></body></html>
